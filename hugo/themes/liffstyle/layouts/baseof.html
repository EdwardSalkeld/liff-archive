<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <header>
    <div class="header-container">
      {{ partial "header.html" . }}
    </div>
  </header>
  <div class="container">
    {{ $isFilmPage := and (eq .Section "films") (eq .Kind "page") }}
    <main{{ if $isFilmPage }} data-pagefind-body{{ else }} data-pagefind-ignore{{ end }}{{ if not .IsHome }} class="content-card"{{ end }}>
      {{ if $isFilmPage }}<span data-pagefind-meta="title" hidden>{{ .Title }}</span>{{ end }}
      {{ block "main" . }}{{ end }}
    </main>
    <footer>
      {{ partial "footer.html" . }}
    </footer>
  </div>
</body>
</html>
